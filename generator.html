<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مولّد الروابط</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{font-family:Arial;background:#f7f1e8;padding:30px}.box{max-width:900px;margin:auto;background:white;padding:28px;border-radius:22px}input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ccb992}button{background:#a97b38;color:white}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:10px;border-bottom:1px solid #eadfce;text-align:right}</style></head><body><div class="box"><h1>مولّد روابط دعوة أنس ومريم</h1><p>ارفع Excel فيه عمود اسمه Name أو الاسم.</p><input id="baseUrl" placeholder="رابط الدعوة الأساسي"><input id="excelFile" type="file" accept=".xlsx,.xls,.csv"><button id="generate">توليد الروابط</button><button id="download" style="display:none">تحميل CSV</button><div class="wrap"><table><thead><tr><th>#</th><th>الاسم</th><th>الرابط</th></tr></thead><tbody id="tb"></tbody></table></div></div><script>let result=[];generate.onclick=async()=>{let f=excelFile.files[0],base=baseUrl.value.trim();if(!f||!base)return alert("اختر الملف واكتب الرابط");if(!base.endsWith("/"))base+="/";let wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});result=rows.map((r,i)=>{let n=String(r.Name||r.name||r["الاسم"]||r["اسم"]||Object.values(r)[0]||"").trim();return{No:i+1,Name:n,Link:base+"?guest="+encodeURIComponent(n)}}).filter(x=>x.Name);tb.innerHTML="";result.forEach(x=>tb.innerHTML+=`<tr><td>${x.No}</td><td>${x.Name}</td><td><a target="_blank" href="${x.Link}">${x.Link}</a></td></tr>`);download.style.display=result.length?"block":"none"};download.onclick=()=>{let csv=XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(result)),b=new Blob(["\ufeff"+csv],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="wedding-links.csv";a.click()}</script></body></html>
