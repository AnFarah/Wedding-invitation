<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مولّد أكواد وروابط الدعوات</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f6efe5;margin:0;padding:28px;color:#40362d}.box{max-width:980px;margin:auto;background:white;padding:30px;border-radius:24px;box-shadow:0 18px 55px rgba(75,52,25,.12)}h1{margin-top:0}.grid{display:grid;gap:12px}input,button{padding:14px;border-radius:11px;border:1px solid #cfbb94;font-size:16px}button{background:#a97b38;color:white;cursor:pointer}.note{line-height:1.8;color:#72665a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.actions button{flex:1;min-width:190px;display:none}.secondary{background:white;color:#815c28}.wrap{overflow:auto;margin-top:22px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid #eadfce;text-align:right;font-size:14px}code{direction:ltr;display:inline-block}
</style>
</head>
<body><div class="box">
<h1>مولّد روابط دعوة أنس ومريم</h1>
<p class="note">ارفع ملف Excel فيه عمود <b>Name</b> أو <b>الاسم</b>. ويمكن إضافة عمود <b>MaxGuests</b> أو <b>عدد الحضور</b>. سيظهر في الرابط كود فقط، وليس اسم الضيف.</p>
<div class="grid"><input id="baseUrl" placeholder="مثال: https://anfarah.github.io/Wedding-invitation/"><input id="excelFile" type="file" accept=".xlsx,.xls,.csv"><button id="generate">توليد الأكواد والروابط</button></div>
<div class="actions"><button id="downloadCsv">تحميل قائمة الروابط CSV</button><button id="downloadJson" class="secondary">تحميل ملف guests.json</button></div>
<div class="wrap"><table><thead><tr><th>#</th><th>الاسم</th><th>عدد الحضور</th><th>الكود</th><th>الرابط</th></tr></thead><tbody id="tableBody"></tbody></table></div>
</div>
<script>
let rowsOutput=[], guestsOutput={};
function randomCode(length=6){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const values=new Uint32Array(length);crypto.getRandomValues(values);return [...values].map(v=>chars[v%chars.length]).join('')}
function download(content,name,type){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
generate.onclick=async()=>{const file=excelFile.files[0];let base=baseUrl.value.trim();if(!file||!base)return alert('اختر ملف Excel واكتب رابط الدعوة الأساسي.');if(!base.endsWith('/'))base+='/';const wb=XLSX.read(await file.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});rowsOutput=[];guestsOutput={};const used=new Set();rows.forEach((row,index)=>{const name=String(row.Name||row.name||row['الاسم']||row['اسم']||Object.values(row)[0]||'').trim();if(!name)return;let code;do code=randomCode();while(used.has(code));used.add(code);const maxGuests=Number(row.MaxGuests||row.maxGuests||row['عدد الحضور']||row['العدد']||1)||1;const link=`${base}?id=${code}`;guestsOutput[code]={name,maxGuests};rowsOutput.push({No:index+1,Name:name,MaxGuests:maxGuests,Code:code,Link:link})});tableBody.innerHTML='';rowsOutput.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${x.No}</td><td>${x.Name}</td><td>${x.MaxGuests}</td><td><code>${x.Code}</code></td><td><a target="_blank" href="${x.Link}">${x.Link}</a></td>`;tableBody.appendChild(tr)});downloadCsv.style.display=rowsOutput.length?'block':'none';downloadJson.style.display=rowsOutput.length?'block':'none'};
downloadCsv.onclick=()=>download('\ufeff'+XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(rowsOutput)),'wedding-invite-links.csv','text/csv;charset=utf-8');
downloadJson.onclick=()=>download(JSON.stringify(guestsOutput,null,2),'guests.json','application/json;charset=utf-8');
</script></body></html>
